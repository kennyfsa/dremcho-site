<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2E7"/>
      <stop offset="100%" stop-color="#F0DCC4"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D48A66"/>
      <stop offset="100%" stop-color="#BC6E49"/>
    </linearGradient>
  </defs>

  <!-- app icon squircle -->
  <rect x="0" y="0" width="512" height="512" rx="132" ry="132" fill="url(#bg)"/>

  <!-- cradle / crescent moon base -->
  <path d="M 130 372 Q 256 430 382 372 Q 340 400 256 400 Q 172 400 130 372 Z" fill="#E3B78F" opacity="0.55"/>

  <!-- sleep dots -->
  <circle cx="352" cy="150" r="8" fill="#C98A66" opacity="0.55"/>
  <circle cx="376" cy="128" r="11" fill="#C98A66" opacity="0.7"/>
  <circle cx="404" cy="102" r="15" fill="#C98A66" opacity="0.85"/>

  <!-- ears -->
  <circle cx="197" cy="228" r="38" fill="url(#body)"/>
  <circle cx="315" cy="228" r="38" fill="url(#body)"/>
  <circle cx="197" cy="230" r="18" fill="#F0DCC4"/>
  <circle cx="315" cy="230" r="18" fill="#F0DCC4"/>

  <!-- head / curled body -->
  <ellipse cx="256" cy="298" rx="118" ry="102" fill="url(#body)"/>

  <!-- blush -->
  <ellipse cx="196" cy="318" rx="20" ry="13" fill="#F4C9A8" opacity="0.8"/>
  <ellipse cx="316" cy="318" rx="20" ry="13" fill="#F4C9A8" opacity="0.8"/>

  <!-- closed sleepy eyes -->
  <path d="M 214 288 Q 228 300 242 288" stroke="#5C3B2A" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 270 288 Q 284 300 298 288" stroke="#5C3B2A" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <ellipse cx="256" cy="322" rx="10" ry="7" fill="#5C3B2A"/>

  <!-- mouth -->
  <path d="M 256 329 Q 256 342 238 344" stroke="#5C3B2A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 256 329 Q 256 342 274 344" stroke="#5C3B2A" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
